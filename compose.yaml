name: evenings

services:
  api:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://evenings:evenings@db:5432/evenings
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: evenings
      POSTGRES_PASSWORD: evenings
      POSTGRES_DB: evenings
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evenings -d evenings"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    # Порт наружу не публикуется: сервис обращается к базе по внутренней сети.
    # Для подключения клиентом с машины раскомментируйте строки ниже.
    # ports:
    #   - "5432:5432"

volumes:
  pgdata:
